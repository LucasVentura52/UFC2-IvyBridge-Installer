name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip capstone keystone-engine

      - name: Verificar sintaxe dos scripts
        run: |
          python -m py_compile payload/apply_hooks.py
          python -m py_compile payload/cpu_check.py
          python -m py_compile payload/cpu_compat.py
          python -m py_compile payload/build_cpu_compat.py
          python -m py_compile tests/test_apply_hooks.py

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Checagem de CPU
        run: python payload/cpu_check.py
